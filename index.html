<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BUG-ONG ES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Poppins:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one console page. Admin = student list beside an editor with live card preview. Student = sign-in, then front and back of their own ID card. */
:root{
  --bg:#eef2f8; --surface:#ffffff; --field:#f3f6fb; --ink:#14213d; --muted:#5b6882; --line:#d5dcea;
  --accent:#245aa8; --accent-ink:#ffffff; --lanyard:#e2b13c; --bad:#b3261e; --good:#17803d; color-scheme:light;
  --card-bg:#f7f9fd; --card-ink:#14213d; --card-muted:#5d6b86; --card-line:#d3dbea; --card-field:#e7edf7; --card-accent:#1f4a96; --card-accent-ink:#ffffff; --card-glow:rgba(31,74,150,.09); --card-ring:rgba(31,74,150,.14);
  --f-display:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
body{background:radial-gradient(90% 40% at 50% -5%,rgba(36,90,168,.13),transparent 70%),linear-gradient(rgba(36,90,168,.045) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,rgba(36,90,168,.045) 1px,transparent 1px) 0 0/44px 44px,var(--bg);background-attachment:fixed;min-height:100vh;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-inline:16px;padding-block:20px 48px}
*{box-sizing:border-box}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
[hidden]{display:none!important}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:30px;height:38px;border-radius:6px;background:var(--accent);position:relative;flex:none}
.brand .mark::before{content:"";position:absolute;top:5px;left:50%;width:12px;height:4px;border-radius:3px;background:var(--bg);transform:translateX(-50%)}
.brand .mark::after{content:"";position:absolute;bottom:0;left:0;right:0;height:5px;background:var(--lanyard);border-radius:0 0 6px 6px}
.brand h1{font:700 20px/1.1 var(--f-display);margin:0;overflow-wrap:anywhere}
.brand small{display:block;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
h2{font:700 18px/1.2 var(--f-display);margin:0}
h3{font:600 13px/1.2 var(--f-body);margin:0;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)} .small{font-size:13px}
label{display:block;font-size:13px;font-weight:500;margin-bottom:4px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-height:40px}
textarea{resize:vertical;min-height:64px}
input[readonly]{color:var(--muted)}
input[type=file]{padding:7px}
:is(input,textarea,button,summary,a):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;min-height:40px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.danger{color:var(--bad)}
button.link{border:0;background:none;padding:4px 6px;min-height:0;color:var(--accent);text-decoration:underline}
button:disabled{opacity:.55;cursor:not-allowed}
.msg{min-height:20px;font-size:13px}
.msg.bad{color:var(--bad)} .msg.good{color:var(--good)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
/* sign-in */
.login{max-width:420px;margin:24px auto 0;width:100%}
/* admin */
.admin{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.admin{grid-template-columns:minmax(0,1fr)}}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:560px;overflow-y:auto}
.item{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--field)}
.item.sel{border-color:var(--accent)}
.item .who{min-width:0;flex:1}
.item .who b{display:block;overflow-wrap:anywhere;font-weight:600}
.item .who span{font-size:12px;color:var(--muted)}
.item .acts{display:flex;gap:2px;flex:none;flex-wrap:wrap;justify-content:flex-end;max-width:130px}
.thumb{width:38px;height:46px;border-radius:6px;object-fit:cover;background:var(--line);flex:none;display:grid;place-items:center;font:600 13px var(--f-display);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid{grid-template-columns:minmax(0,1fr)}}
.grid .wide{grid-column:1/-1}
details>summary{cursor:pointer;font-weight:600}
.cards{display:flex;flex-wrap:wrap;gap:20px;justify-content:center}
/* the ID card itself: a printed card, so it keeps its own light colours in both themes */
.idcard{position:relative;width:100%;max-width:340px;aspect-ratio:27/40;container-type:inline-size;overflow:hidden;border-radius:18px;
  --sw1:#0072bc;--sw2:#29abe2;--nv:#0a1a4a;--tx:#2d3a36;--mu:#4b5a66;
  background:linear-gradient(165deg,#fff 0%,#f5f7fb 50%,#e8edf6 100%);color:var(--tx);font-family:"Poppins","Public Sans",system-ui,sans-serif;box-shadow:0 24px 40px -26px rgba(20,33,61,.45)}
.idcard.teacher{--sw1:#1c6e55;--sw2:#3fae8c;--nv:#10332a;--tx:#23372f}
.idcard .sw{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.idcard .in{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 6cqw}
.idcard .seal{width:24cqw;height:24cqw;margin-top:9cqw;border-radius:50%;background:#fff;object-fit:contain;box-shadow:0 0 0 1.4cqw #fff,0 .6cqw 3cqw rgba(0,0,0,.1);display:grid;place-items:center;font:700 12cqw Poppins,sans-serif;color:var(--sw1)}
.idcard .sch{font-weight:700;font-size:4.1cqw;line-height:1.2;color:var(--nv);margin-top:3cqw;text-transform:uppercase;letter-spacing:.01em}
.idcard .sm{font-weight:700;font-size:3.1cqw;line-height:1.35;color:var(--nv)}
.idcard .photo{width:56cqw;aspect-ratio:1/1;border-radius:10cqw;border:1.4cqw solid var(--sw1);object-fit:cover;background:linear-gradient(#c9e9fb,#effaff 70%,#a6c95a 70%);margin-top:4.5cqw;display:grid;place-items:center;font:700 14cqw Poppins,sans-serif;color:var(--sw1);flex:none}
.idcard .nm{font:700 5.6cqw/1.15 Georgia,"Times New Roman",serif;text-transform:uppercase;margin-top:3.5cqw;text-wrap:balance;overflow-wrap:anywhere;color:var(--tx)}
.idcard .idno{font:700 4.5cqw/1.2 Georgia,"Times New Roman",serif;margin-top:.8cqw;color:var(--tx)}
.idcard .sub{font-weight:600;font-size:3cqw;color:var(--mu);margin-top:1cqw}
.idcard .deped{width:35cqw;margin-top:8cqw;mix-blend-mode:multiply;display:block}
.idcard .wm{position:absolute;left:50%;top:49%;width:62cqw;height:62cqw;transform:translate(-50%,-50%);object-fit:contain;opacity:.13;z-index:0}
.idcard .t{font-size:3.9cqw;line-height:1.3;color:var(--tx);overflow-wrap:anywhere}
.idcard .t b{font-weight:700}
.idcard .em{margin-top:6cqw}
.idcard .em .pn{font-size:4.4cqw;font-weight:700;color:var(--nv)}
.idcard .cert{margin-top:6cqw;font-size:3.7cqw;line-height:1.3;padding:0 4cqw}
.idcard .vh{margin-top:4.5cqw;font-weight:700;font-size:4.3cqw;color:var(--nv)}
.idcard .vt{margin-top:1.8cqw;width:64cqw;display:grid;grid-template-columns:1.1fr 1.15fr .9fr;border:.5cqw solid var(--nv);border-radius:3.5cqw;background:rgba(255,255,255,.7);overflow:hidden}
.idcard .vt>div{padding:1.7cqw 1.6cqw;font-weight:700;font-size:2.4cqw;line-height:1.3;border-bottom:.4cqw solid var(--nv);border-right:.4cqw solid var(--nv);min-height:6.6cqw;display:flex;align-items:center;text-align:left}
.idcard .vt>div:nth-child(3n){border-right:0}
.idcard .vt>div:nth-last-child(-n+3){border-bottom:0}
.idcard .sg{width:17cqw;height:5cqw;object-fit:contain;margin-top:2cqw;margin-bottom:-1.2cqw;position:relative;z-index:1}
.idcard .vt img{width:100%;max-height:6cqw;object-fit:contain}
.idcard .pr{margin-top:0;font-weight:700;font-size:4.2cqw;color:var(--tx);text-transform:uppercase;line-height:1.1}
.idcard .pt{font-size:3cqw;color:var(--mu);margin-top:.4cqw}
.idcard .bc{position:absolute;left:50%;bottom:4.5cqw;transform:translateX(-50%);z-index:2;width:50cqw;display:flex;flex-direction:column;align-items:center;gap:.4cqw;padding:1.6cqw 3cqw 1.2cqw;background:#fff;border-radius:3cqw;box-shadow:0 .4cqw 2cqw rgba(0,0,0,.18)}
.idcard .bc svg{width:100%;height:7cqw;display:block}
.idcard .bc span{font:500 2.4cqw "IBM Plex Mono",monospace;letter-spacing:.2em;color:#141a26}
.idcard.sample::after{content:"SAMPLE";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-24deg);white-space:nowrap;font:700 54px var(--f-display);letter-spacing:.12em;color:rgba(255,255,255,.07);pointer-events:none}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}

/* polish */
.panel{border-radius:16px;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 20px 40px -30px rgba(20,33,61,.3);background:linear-gradient(180deg,rgba(255,255,255,.025),transparent 40%),var(--surface)}
.brand h1{font-size:22px;letter-spacing:.01em}
.brand small{letter-spacing:.14em;color:var(--accent)}
header.top{padding-bottom:16px;border-bottom:1px solid var(--line)}
h2{font-size:24px;letter-spacing:-.01em}
.login{margin-top:40px;padding:28px;border-top:3px solid var(--accent);max-width:400px}
input,textarea,select{border-radius:10px;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(36,90,168,.2)}
button{border-radius:10px;transition:transform .12s,background .15s,border-color .15s}
button:hover:not(:disabled){border-color:var(--accent)}
button:active:not(:disabled){transform:translateY(1px)}
button.primary{box-shadow:0 8px 20px -10px rgba(36,90,168,.7)}
button.primary:hover:not(:disabled){background:#2d6cc4}
.item{border-radius:12px;transition:border-color .15s,background .15s}
.item:hover{border-color:#aab6cf}
.item.sel{background:rgba(36,90,168,.08)}
.cards{gap:28px}
input[type=file]::file-selector-button{font:inherit;font-weight:600;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:5px 10px;margin-right:10px;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>

    <div class="row" id="hdrRight"></div>
  </header>
  <main id="main"><div class="panel login"><p class="muted">Loading…</p></div></main>
</div>

  const e=document.createElement(tag);

}

/* ---------- crypto: each card is encrypted with a key made from its password ---------- */
async function deriveKey(pw,salt){
  const km=await crypto.subtle.importKey("raw",te.encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:200000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function seal(id,pw,rec){
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveKey(pw,salt);
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv,additionalData:te.encode(id)},key,te.encode(JSON.stringify(rec)));
  return {salt:b64e(salt),iv:b64e(iv),ct:b64e(new Uint8Array(ct)),v:1};
}
async function open(id,pw,c){
  const key=await deriveKey(pw,b64d(c.salt));
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(c.iv),additionalData:te.encode(id)},key,b64d(c.ct));
  return JSON.parse(td.decode(pt));
}

  let x=10;

      r.setAttribute("x",x);r.setAttribute("y",0);r.setAttribute("width",w);r.setAttribute("height",10);r.setAttribute("fill","#000");
      svg.append(r);

  svg.setAttribute("role","img");svg.setAttribute("aria-label","Barcode of "+id);

}

function readForm(){
  const o={};for(const f of FIELDS)o[f[0]]=$("#f_"+f[0]).value.trim();
  o.id=o.id.toUpperCase();o.photo=photoData;o.role=$("#f_role").value;return o;
}
function loadForm(rec,role){
  editing=rec?rec.id:null;photoData=rec?rec.photo||"":"";
  const r=rec?(rec.role||"student"):(role||"student");$("#f_role").value=r;applyRole(r);
  for(const f of FIELDS){const el=$("#f_"+f[0]);el.value=rec?(rec[f[0]]||""):(f[0]==="year"?defaultYear():f[0]==="valid"?defaultValid():"")}
  $("#f_id").readOnly=!!rec;$("#f_pw").value="";$("#f_pw").type="password";$("#f_pwb").textContent="Show";$("#f_photo").value="";
  $("#formTitle").textContent=rec?"Edit "+(rec.name||rec.id):"New "+r;
  setMsg($("#formMsg"),"");paintList();previewCard();paintNfc();
}
function previewCard(){const p=$("#preview");if(!p)return;const r=readForm(),sample=!r.id&&!r.name;p.replaceChildren(cardsRow(sample?(r.role==="teacher"?SAMPLE_T:SAMPLE):r,sample))}
function nfcLink(id){
  const base=(school.link||location.origin+location.pathname).replace(/#.*$/,""),st=students.find(x=>x.id===id);
  return base&&st&&st.tap?base+"#"+id+"~"+st.tap:"";
}
function paintNfc(){
  const box=$("#nfcBox");if(!box)return;box.replaceChildren();
  if(!editing)return;
  const link=nfcLink(editing);
  if(!link){box.append(h("p",{class:"muted small"},"The NFC link appears here once this page's link is saved in School settings and this person has been saved."));return}
  const inp=h("input",{id:"nfcLink",type:"text",readonly:true,value:link});
  const note=h("span",{class:"small muted"},"");
  box.append(h("div",{},h("label",{for:"nfcLink"},"NFC link (anyone who taps the card sees this ID)"),
    h("div",{class:"row",style:"flex-wrap:nowrap"},inp,h("button",{type:"button",onclick:async()=>{
      try{await navigator.clipboard.writeText(link);note.textContent="Copied."}catch(e){inp.select();note.textContent="Press copy on your keyboard."}
    }},"Copy")),note));
}
function paintList(){
  const ul=$("#list");if(!ul)return;ul.replaceChildren();
  const q=listFilter,items=students.filter(s=>(!roleFilter||(s.role||"student")===roleFilter)&&(!q||(s.name||"").toLowerCase().includes(q)||(s.id||"").toLowerCase().includes(q)));
  if(!students.length){ul.append(h("li",{class:"empty"},"No one added yet. Choose Add student or Add teacher to start."));return}
  if(!items.length){ul.append(h("li",{class:"empty"},"No match."));return}
  for(const s of items){
    const thumb=s.photo&&s.photo.startsWith("data:image/jpeg;base64,")?h("img",{class:"thumb",src:s.photo,alt:""}):h("div",{class:"thumb","aria-hidden":"true"},(s.name||"?")[0]);
    const del=h("button",{class:"link danger",type:"button"},"Delete");
    let armed=false,t;
    del.addEventListener("click",async()=>{
      if(!armed){armed=true;del.textContent="Confirm";t=setTimeout(()=>{armed=false;del.textContent="Delete"},4000);return}
      clearTimeout(t);del.disabled=true;
      try{await db.doc("students/"+s.id).delete();await db.doc("cards/"+s.id).delete();syncRosters(students.filter(x=>x.id!==s.id)).catch(()=>{});if(editing===s.id)loadForm(null)}
      catch(e){del.disabled=false;del.textContent="Delete";setMsg($("#formMsg"),"Could not delete. Try again.","bad")}
    });
    const cp=h("button",{class:"link",type:"button"},"Copy link");
    cp.addEventListener("click",async()=>{
      const l=nfcLink(s.id),back=()=>setTimeout(()=>{cp.textContent="Copy link"},2500);
      if(!l){cp.textContent="No link yet";back();return}
      try{await navigator.clipboard.writeText(l);cp.textContent="Copied"}catch(e){cp.textContent="Open Edit to copy"}
      back();
    });
    ul.append(h("li",{class:"item"+(editing===s.id?" sel":"")},thumb,
      h("div",{class:"who"},h("b",{},s.name||"(no name)"),h("span",{class:"mono"},s.id),h("span",{}," · "+[s.role==="teacher"?"Teacher":"Student",s.grade,s.section].filter(Boolean).join(" · ")) ),
      h("div",{class:"acts"},cp,h("button",{class:"link",type:"button",onclick:()=>loadForm(s)},"Edit"),del)));
  }
}
let saving=false;
async function syncRosters(list){
  for(const t of list.filter(x=>x.role==="teacher"&&x.rkey&&x.handles)){
    const k=normN(t.handles);
    const l=list.filter(x=>x.role!=="teacher"&&(normN((x.grade||"")+(x.section||""))===k||(x.section&&normN(x.section)===k))).map(x=>({n:x.name,i:x.id,k:x.akey}));
    await db.doc("rosters/"+t.id).set(await seal("roster-"+t.id,t.rkey,{list:l}));
  }
}
async function saveStudent(e){
  e.preventDefault();if(saving)return;
  const msg=$("#formMsg"),rec=readForm(),pw=$("#f_pw").value;
  if(!ID_RE.test(rec.id))return setMsg(msg,"ID number needs 3 to 30 letters, numbers, dots or dashes.","bad");
  if(!rec.name)return setMsg(msg,"Enter the full name.","bad");
  if(pw.length<6)return setMsg(msg,"Card password needs at least 6 characters.","bad");
  if(!editing&&students.some(s=>s.id===rec.id))return setMsg(msg,"That ID number is already in use. Edit that person instead.","bad");
  saving=true;$("#saveBtn").disabled=true;setMsg(msg,"Saving…");
  try{
    const prev=students.find(x=>x.id===rec.id), tap=(prev&&prev.tap)||genTap();
    if(rec.role==="teacher")rec.rkey=(prev&&prev.rkey)||genTap();
    else rec.akey=(prev&&prev.akey)||genTap();
    const card=await seal(rec.id,pw,rec);card.t=await seal(rec.id,tap,rec);
    await db.doc("cards/"+rec.id).set(card);
    await db.doc("students/"+rec.id).set({...rec,tap});
    syncRosters(students.filter(x=>x.id!==rec.id).concat({...rec,tap})).catch(()=>{});
    editing=rec.id;$("#f_id").readOnly=true;$("#f_pw").value="";$("#f_pw").type="password";$("#f_pwb").textContent="Show";
    $("#formTitle").textContent="Edit "+rec.name;
    setMsg(msg,"Saved. The card password is now the one you just entered.","good");paintList();paintNfc();
  }catch(err){setMsg(msg,"Could not save. Check your connection and try again.","bad")}
  saving=false;$("#saveBtn").disabled=false;
}
function loadPhoto(file){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const W=240,H=300,cv=document.createElement("canvas");cv.width=W;cv.height=H;
      const x=cv.getContext("2d"),s=Math.max(W/img.width,H/img.height),w=img.width*s,hh=img.height*s;
      x.drawImage(img,(W-w)/2,(H-hh)/2,w,hh);URL.revokeObjectURL(url);res(cv.toDataURL("image/jpeg",.8));
    };
    img.onerror=()=>rej(new Error("bad image"));img.src=url;
  });
}

function loadLogo(file){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const S=160,cv=document.createElement("canvas");cv.width=cv.height=S;
      const x=cv.getContext("2d"),k=Math.min(S/img.width,S/img.height),w=img.width*k,hh=img.height*k;
      x.drawImage(img,(S-w)/2,(S-hh)/2,w,hh);URL.revokeObjectURL(url);res(cv.toDataURL("image/png"));
    };
    img.onerror=()=>rej(new Error("bad image"));img.src=url;
  });
}

/* ---------- start ---------- */
// A card link looks like #ID~KEY (KEY = 16 letters or digits). It opens the ID card alone.
function tapParts(){const m=(location.hash||"").slice(1).match(/^(.+)~([A-Za-z0-9]{16})$/);return m?{id:m[1].toUpperCase(),key:m[2]}:null}
function tapMsg(t){$("#main").replaceChildren(h("p",{class:"muted",style:"text-align:center;padding:24px"},t))}
async function loadTap(t){
  try{
    const snap=await db.doc("cards/"+t.id).get();
    tapRec=await open(t.id,t.key,snap.data().t);
    recordTap(tapRec);
    refresh();
  }catch(e){tapMsg("This ID link is not valid.")}
}
(async function(){
  const tap=tapParts(), cfg=window.FIREBASE_CONFIG;
  if(tap)document.querySelector("header.top").hidden=true;
  let why=!window.firebase?"The Firebase library did not load. Check the internet and turn off ad blockers.":!cfg?"firebase-config.js is missing or has an error.":(!cfg.apiKey||/PASTE/.test(cfg.apiKey))?"firebase-config.js still has the PASTE placeholders.":(!crypto||!crypto.subtle)?"This browser cannot open secure cards. Use Chrome or Safari.":"";
  if(!why){try{firebase.initializeApp(cfg);db=firebase.firestore();auth=firebase.auth();if(auth.getRedirectResult)auth.getRedirectResult().catch(()=>{})}catch(e){why="Firebase could not start: "+e.message}}
  if(why){if(tap)tapMsg("This ID link is not available right now. "+why);else{setMode("unavailable");$("#main .muted").append(" ("+why+")")}return}
  const u=tap?null:await new Promise(r=>{const off=auth.onAuthStateChanged(x=>{off();r(x)})});
  // Only the admin account is allowed to read "students" (see firestore.rules), so a successful read means admin.
  if(u){who=u.email||"";try{await db.collection("students").limit(1).get();isAdmin=true}catch(e){}}
  if(tap){mode="tap";tapMsg("Loading ID\u2026")}else setMode(isAdmin?"admin":"login");
  db.doc("config/app").onSnapshot(s=>{
    if(s.exists){const d=s.data();school={name:d.name||school.name,link:d.link||"",logo:d.logo||school.logo}}
    if(isAdmin&&!cfgFilled&&$("#c_name")){$("#c_name").value=school.name;$("#c_link").value=school.link;cfgFilled=true}
    refresh();
  },()=>{});
  if(tap){loadTap(tap);return}
  if(isAdmin)db.collection("students").orderBy("name").onSnapshot(q=>{students=q.docs.map(d=>d.data());refresh()},()=>{});
})();
})();
</script>
